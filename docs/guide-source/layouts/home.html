<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="从本地预览到 GitHub 免费上线，再到发文章、备份、恢复的完整中文教程。">
  <title>{{ .Site.Title }}</title>
  <style>
    :root{--ink:#24332f;--muted:#61716b;--line:#dce4de;--paper:#fffdf7;--green:#176b53;--soft:#edf4ef}
    *{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:24px}body{margin:0;background:#f0f3ee;color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;line-height:1.85;font-size:16px}
    .shell{max-width:1380px;margin:auto;display:grid;grid-template-columns:310px minmax(0,1fr);gap:26px;padding:30px 24px}aside{position:sticky;top:24px;height:calc(100vh - 48px);overflow:auto;padding:22px;background:var(--paper);border:1px solid var(--line);border-radius:12px}aside strong{font-size:19px;display:block}aside p{font-size:13px;color:var(--muted);margin:6px 0 16px}
    aside ul{list-style:none;padding:0;margin:0}aside li{margin:5px 0}aside ul ul{margin:4px 0 8px;padding-left:12px;border-left:2px solid var(--line)}aside a{text-decoration:none;color:var(--ink);font-size:14px;line-height:1.5;display:block;padding:4px 0}aside a:hover{color:var(--green)}
    main{min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:44px 52px;box-shadow:0 6px 22px #23352c08}h1{font-size:32px;line-height:1.4;letter-spacing:-.3px;margin:0 0 20px}h2{font-size:24px;margin-top:54px;padding-top:22px;border-top:2px solid var(--line);line-height:1.5}h3{font-size:19px;margin-top:32px;line-height:1.6}p{margin:15px 0}a{color:var(--green);text-underline-offset:3px;overflow-wrap:anywhere}strong{font-weight:700}li{margin:7px 0}ol,ul{padding-left:26px}
    code{font-family:Consolas,"Cascadia Code",monospace;font-size:.9em;background:var(--soft);padding:2px 6px;border-radius:4px;overflow-wrap:anywhere}pre{padding:18px 20px;overflow:auto;background:#f3f5f0!important;border:1px solid var(--line);border-radius:8px;line-height:1.6}pre code{padding:0;background:none;overflow-wrap:normal;font-size:14px}.highlight pre{margin:16px 0}
    table{display:block;overflow-x:auto;max-width:100%;border-collapse:collapse;font-size:14px;margin:24px 0}th,td{border:1px solid var(--line);padding:12px 14px;min-width:140px;vertical-align:top}th{background:var(--soft);text-align:left}tr:nth-child(even){background:#f7f9f4}blockquote{border-left:4px solid var(--green);margin:20px 0;padding:2px 20px;background:var(--soft)}.footer{border-top:1px solid var(--line);padding-top:24px;margin-top:40px;font-size:13px;color:var(--muted)}.check{background:var(--soft);padding:12px 16px;border-radius:8px;color:var(--green);margin-bottom:28px}
    @media(max-width:1000px){.shell{grid-template-columns:240px minmax(0,1fr);gap:16px;padding:18px}main{padding:30px}aside{padding:16px}h1{font-size:28px}}
    @media(max-width:760px){.shell{display:block;padding:12px}aside{position:static;height:auto;max-height:350px;margin-bottom:16px}main{padding:26px 20px}body{font-size:15px}h1{font-size:26px}h2{font-size:22px}pre{padding:14px}th,td{min-width:120px;padding:10px}}
    @media print{body{background:white;font-size:11pt}.shell{display:block;padding:0}aside{display:none}main{border:0;box-shadow:none;padding:0}h2{break-before:auto;break-after:avoid}h3{break-after:avoid}pre{white-space:pre-wrap;overflow-wrap:anywhere;break-inside:avoid}table{display:table;width:100%;font-size:9pt}th,td{min-width:0;padding:7px}a{color:inherit}.check{display:none}h1{font-size:24pt}}
  </style>
</head>
<body>
  <div class="shell">
    <aside aria-label="教程目录">
      <strong>完整教程目录</strong>
      <p>点击跳到对应步骤。按编号依次完成；做完看“检查结果”。</p>
      {{ .TableOfContents }}
    </aside>
    <main>
      <div class="check">离线阅读版 · Windows / VS Code / Git · 可用浏览器 Ctrl+P 打印或保存为 PDF</div>
      {{ .Content }}
      <p class="footer">本页无需联网即可阅读正文。外部资料链接、GitHub 登录与首次工具下载需要网络。</p>
    </main>
  </div>
</body>
</html>
